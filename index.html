<!DOCTYPE html>
<html>
<head>
  <title>AI Smart Home Control Panel</title>
  <style>
    body {
      background-color: lightblue;
      text-align: center;
      font-family: Arial;
    }

    h1 {
      color: navy;
    }

    h2 {
      color: green;
    }

    img {
      width: 150px;
    }

    #security-alert {
      background-color: red;
      color: white;
      padding: 10px;
    }

    button {
      background-color: navy;
      color: white;
      padding: 10px;
      margin: 5px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <h1>AI Smart Home Control Panel</h1>

  <h2 id="system-status">System Status: Secure</h2>

  <img
    id="device-image"
    src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f8/Light_bulb_off.svg/200px-Light_bulb_off.svg.png"
    alt="Lightbulb off"
  />

  <p id="security-alert" hidden>⚠️ ALERT: Backyard Motion Detected!</p>

  <br>

  <button onclick="triggerAlarm()">Trigger Alarm</button>
  <button onclick="toggleLamp()">Toggle Living Room Lamp</button>
  <button onclick="dismissAlert()">Dismiss Alert</button>

  <script>
    function triggerAlarm() {
      document.getElementById("system-status").textContent = "System Status: 🚨 BREACH DETECTED!";
      document.getElementById("security-alert").hidden = false;
    }

    function toggleLamp() {
      var img = document.getElementById("device-image");

      if (img.src.includes("off")) {
        img.src = "https://upload.wikimedia.org/wikipedia/commons/thumb/1/13/Light_bulb_lit.svg/200px-Light_bulb_lit.svg.png";
      } else {
        img.src = "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f8/Light_bulb_off.svg/200px-Light_bulb_off.svg.png";
      }
    }

    function dismissAlert() {
      document.getElementById("security-alert").hidden = true;
      document.getElementById("system-status").textContent = "System Status: Secure";
    }
  </script>

</body>
</html>
