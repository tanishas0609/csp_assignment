<!DOCTYPE html>
<html>
<head>
  <title>AI Smart Home Control Panel</title>
  <style>
    body {
      background-color: lightblue;
      text-align: center;
      font-family: Arial;
    }

    h1 {
      color: navy;
    }

    h2 {
      color: green;
    }

    #bulb {
      font-size: 100px;
    }

    #security-alert {
      background-color: red;
      color: white;
      padding: 10px;
    }

    button {
      background-color: navy;
      color: white;
      padding: 10px;
      margin: 5px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <h1>AI Smart Home Control Panel</h1>

  <h2 id="system-status">System Status: Secure</h2>

  <p id="bulb">💡</p>

  <p id="security-alert" hidden>⚠️ ALERT: Backyard Motion Detected!</p>

  <br>

  <button onclick="triggerAlarm()">Trigger Alarm</button>
  <button onclick="toggleLamp()">Toggle Living Room Lamp</button>
  <button onclick="dismissAlert()">Dismiss Alert</button>

  <script>
    function triggerAlarm() {
      document.getElementById("system-status").textContent = "System Status: 🚨 BREACH DETECTED!";
      document.getElementById("security-alert").hidden = false;
    }

    function toggleLamp() {
      var bulb = document.getElementById("bulb");

      if (bulb.textContent === "💡") {
        bulb.textContent = "🌑";
      } else {
        bulb.textContent = "💡";
      }
    }

    function dismissAlert() {
      document.getElementById("security-alert").hidden = true;
      document.getElementById("system-status").textContent = "System Status: Secure";
    }
  </script>

</body>
</html>
